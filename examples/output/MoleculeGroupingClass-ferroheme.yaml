id: CHEBI:38573
name: ferroheme
description: Any iron(II)-porphyrin coordination complex. The differentia is the +2
  oxidation state of the iron. The formal charge written on the iron in SMILES does
  not show it (ChEBI draws ferroheme b with an Fe(-2) centre and ferroheme a with
  a neutral one), but it can be computed from the structure, for example with RDKit's
  CalcOxidationNumbers, and it equals the Fe charge in the standard InChI. It is a
  property of the iron atom rather than of the molecule, so none of the current grouping
  patterns can define this class. Members state it on their iron AtomOccurrence via
  oxidation_number.
subtype_of:
