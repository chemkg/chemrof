id: CHEBI:61910
name: very long-chain fatty acyl-CoA
description: A linear fatty acyl-CoA in which the fatty acyl group has a chain length greater than C22. Very long-chain fatty acyl-CoAs are shortened by peroxisomal (partial) beta-oxidation before completion in the mitochondrion.
